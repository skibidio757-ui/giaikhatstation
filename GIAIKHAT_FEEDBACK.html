<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Phản Hồi – Giải Khát Station</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --green:#8BC34A;--orange:#FF9800;--bg:#0b1209;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Be Vietnam Pro',sans-serif;background:#0b1209;color:#fff;overflow:hidden}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#0b1209}
::-webkit-scrollbar-thumb{background:#8BC34A;border-radius:3px}

/* ── LAYOUT FULL HEIGHT ── */
.page{display:flex;flex-direction:column;height:100vh}

/* ── TOPBAR ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.75rem 1.25rem;flex-shrink:0;
  background:rgba(11,18,9,.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.logo-wrap{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-img{height:46px;width:46px;object-fit:contain;border-radius:10px}
.logo-text .t1{font-size:1.15rem;font-weight:900;color:#fff;line-height:1.1}
.logo-text .t2{font-size:.65rem;font-weight:700;color:#8BC34A;letter-spacing:.2em}
.back-btn{
  display:flex;align-items:center;gap:6px;
  padding:.5rem 1rem;border-radius:10px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
  color:rgba(255,255,255,.7);font-size:.82rem;font-weight:600;
  cursor:pointer;text-decoration:none;transition:all .2s;
  font-family:'Be Vietnam Pro',sans-serif;
}
.back-btn:hover{background:rgba(255,255,255,.13);color:#fff}

/* ── HEADER CHAT BOX ── */
.chat-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:.75rem 1.25rem;flex-shrink:0;
  background:rgba(0,0,0,.25);
  border-bottom:1px solid rgba(255,255,255,.07);
}
.chat-dots{display:flex;gap:5px}
.dot{width:11px;height:11px;border-radius:50%}
.chat-title{font-size:.82rem;font-weight:600;color:rgba(255,255,255,.6);display:flex;align-items:center;gap:6px}
.live-badge{display:flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;color:#8BC34A}
.live-dot{width:7px;height:7px;border-radius:50%;background:#8BC34A;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── MESSAGES AREA ── */
.messages{
  flex:1;overflow-y:auto;padding:1rem 1.25rem;
  display:flex;flex-direction:column;gap:12px;
  scroll-behavior:smooth;
}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-thumb{background:rgba(139,195,74,.3);border-radius:4px}

/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:10px;opacity:.4;text-align:center}
.empty i{font-size:2.5rem;color:rgba(255,255,255,.3)}
.empty p{font-size:.85rem;color:rgba(255,255,255,.4);line-height:1.6}

/* Bubble */
.bubble-wrap{display:flex;flex-direction:column;gap:3px;animation:bIn .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes bIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.bubble-row{display:flex;align-items:flex-end;gap:8px}
.avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#8BC34A,#FF9800);
  display:flex;align-items:center;justify-content:center;
  font-size:.78rem;font-weight:900;color:#fff;
}
.bubble{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  border-radius:18px 18px 18px 4px;
  padding:10px 14px;max-width:80%;
}
.bname{font-weight:700;font-size:.78rem;color:#8BC34A;margin-bottom:3px}
.btext{font-size:.88rem;color:rgba(255,255,255,.88);line-height:1.55;word-break:break-word}
.btime{font-size:.68rem;color:rgba(255,255,255,.28);margin-left:40px}

/* ── USER BAR ── */
.user-bar{
  padding:.65rem 1.25rem;flex-shrink:0;
  border-top:1px solid rgba(255,255,255,.06);
  background:rgba(0,0,0,.15);
  display:flex;align-items:center;justify-content:space-between;min-height:52px;
}
.user-info{display:flex;align-items:center;gap:8px}
.u-avatar{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,#8BC34A,#FF9800);
  display:flex;align-items:center;justify-content:center;
  font-size:.75rem;font-weight:900;color:#fff;flex-shrink:0;
}
.u-name{font-size:.82rem;font-weight:700;color:#8BC34A}
.u-sub{font-size:.68rem;color:rgba(255,255,255,.35)}
.login-prompt{display:flex;align-items:center;gap:10px;width:100%}
.login-prompt span{font-size:.82rem;color:rgba(255,255,255,.45);display:flex;align-items:center;gap:6px}
.login-btn{
  padding:.45rem 1rem;border-radius:9px;font-size:.8rem;font-weight:700;
  background:linear-gradient(135deg,#8BC34A,#FF9800);color:#fff;
  border:none;cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;
  transition:all .2s;white-space:nowrap;
}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(139,195,74,.35)}

/* ── INPUT BAR ── */
.input-bar{
  display:flex;gap:8px;align-items:flex-end;
  padding:.75rem 1.25rem;flex-shrink:0;
  background:rgba(11,18,9,.6);
  border-top:1px solid rgba(255,255,255,.07);
}
.fb-textarea{
  flex:1;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);border-radius:14px;
  color:#fff;font-size:.9rem;padding:.6rem 1rem;
  outline:none;resize:none;
  font-family:'Be Vietnam Pro',sans-serif;
  min-height:42px;max-height:110px;
  transition:border-color .2s;line-height:1.5;
}
.fb-textarea::placeholder{color:rgba(255,255,255,.3)}
.fb-textarea:focus{border-color:#8BC34A;box-shadow:0 0 0 3px rgba(139,195,74,.12)}
.fb-textarea:disabled{opacity:.4;cursor:not-allowed}
.send-btn{
  width:42px;height:42px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,#8BC34A,#FF9800);
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .22s;font-size:.95rem;
}
.send-btn:hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(139,195,74,.4)}
.send-btn:active{transform:scale(.95)}
.send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* ── CHAR COUNT ── */
.bottom-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:.3rem 1.25rem .6rem;flex-shrink:0;
  background:rgba(11,18,9,.6);
}
.char-count{font-size:.7rem;color:rgba(255,255,255,.25)}
.hint{font-size:.7rem;color:rgba(255,255,255,.18)}

/* ── AUTH OVERLAY ── */
.auth-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  backdrop-filter:blur(16px);z-index:100;
  display:none;align-items:center;justify-content:center;padding:1rem;
}
.auth-overlay.open{display:flex}
.auth-box{
  background:rgba(15,24,12,.97);border:1px solid rgba(255,255,255,.12);
  border-radius:22px;width:100%;max-width:400px;padding:2rem 1.75rem;
  animation:bIn .35s cubic-bezier(.34,1.56,.64,1);
}
.tab-wrap{display:flex;padding:4px;border-radius:16px;background:rgba(255,255,255,.06);margin-bottom:1.5rem}
.tab-btn{flex:1;padding:.6rem;border-radius:12px;font-size:.85rem;font-weight:700;border:none;cursor:pointer;transition:all .25s;font-family:'Be Vietnam Pro',sans-serif}
.tab-active{background:linear-gradient(135deg,#8BC34A,#FF9800);color:#fff}
.tab-inactive{background:none;color:rgba(255,255,255,.45)}
.auth-input{
  width:100%;padding:.75rem 1rem .75rem 2.5rem;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
  border-radius:11px;color:#fff;font-size:.9rem;outline:none;
  font-family:'Be Vietnam Pro',sans-serif;transition:border-color .2s;
}
.auth-input:focus{border-color:#8BC34A}
.auth-input::placeholder{color:rgba(255,255,255,.3)}
.input-wrap{position:relative;margin-bottom:.75rem}
.input-icon{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.35);font-size:.85rem}
.eye-btn{position:absolute;right:.85rem;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;font-size:.9rem;padding:3px}
.eye-btn:hover{color:rgba(255,255,255,.8)}
.auth-submit{
  width:100%;padding:.85rem;border-radius:13px;margin-top:.5rem;
  background:linear-gradient(135deg,#8BC34A,#FF9800);color:#fff;
  font-size:.9rem;font-weight:800;border:none;cursor:pointer;
  font-family:'Be Vietnam Pro',sans-serif;transition:all .25s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.auth-submit:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(139,195,74,.4)}
.ferr{font-size:.75rem;color:#f87171;margin-top:4px;display:flex;align-items:center;gap:4px}
.auth-toggle{text-align:center;font-size:.82rem;color:rgba(255,255,255,.4);margin-top:1rem}
.auth-toggle button{background:none;border:none;color:#8BC34A;font-weight:700;cursor:pointer;font-family:'Be Vietnam Pro',sans-serif}
.auth-close{position:absolute;top:1rem;right:1rem;background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;font-size:1rem;padding:4px}

/* ── TOAST ── */
#toast-wrap{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:200;display:flex;flex-direction:column;gap:10px;
  align-items:center;pointer-events:none;width:90%;max-width:340px;
}
.toast{
  display:flex;align-items:flex-start;gap:10px;padding:12px 16px;
  border-radius:14px;background:rgba(20,30,18,.95);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.12);box-shadow:0 14px 35px rgba(0,0,0,.4);
  pointer-events:auto;min-width:220px;position:relative;
  animation:bIn .35s cubic-bezier(.34,1.56,.64,1);
}
.toast.out{animation:tOut .28s ease forwards}
@keyframes tOut{to{opacity:0;transform:scale(.88)}}
.t-prog{position:absolute;bottom:0;left:0;height:3px;border-radius:0 0 14px 14px;animation:tP 3s linear forwards}
@keyframes tP{from{width:100%}to{width:0}}
</style>
</head>

<script>
/* ── FIREBASE CONFIG ── */
const firebaseConfig = {

  apiKey: "AIzaSyBuCLyl6W-mTp_P1ML-daoWqsVP0gWP4UI",

  authDomain: "giaikhatstaton.firebaseapp.com",

  projectId: "giaikhatstaton",

  storageBucket: "giaikhatstaton.firebasestorage.app",

  messagingSenderId: "292568980848",

  appId: "1:292568980848:web:7a6fa596a321c5478943b5",

  measurementId: "G-DG9LQLGZS0"

};


let auth, db, FB_OK = false;
try {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db   = firebase.firestore();
  FB_OK = firebaseConfig.apiKey !== 'YOUR_API_KEY';
} catch(e) { console.error('Firebase init:', e); }

/* ── HELPERS ── */
function nowGMT7() {
  const d = new Date(Date.now() + 7*3600000);
  const p = n => String(n).padStart(2,'0');
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())} GMT+7`;
}
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ── TOAST ── */
function showToast(type,title,msg='') {
  const wrap = document.getElementById('toast-wrap');
  const c = {success:{bg:'rgba(139,195,74,.18)',b:'rgba(139,195,74,.4)',ic:'#8BC34A',i:'fa-check-circle'},error:{bg:'rgba(244,67,54,.18)',b:'rgba(244,67,54,.4)',ic:'#f44336',i:'fa-times-circle'},warning:{bg:'rgba(255,152,0,.18)',b:'rgba(255,152,0,.4)',ic:'#FF9800',i:'fa-exclamation-triangle'},info:{bg:'rgba(255,255,255,.08)',b:'rgba(255,255,255,.2)',ic:'#AED581',i:'fa-info-circle'}}[type]||{bg:'rgba(255,255,255,.08)',b:'rgba(255,255,255,.2)',ic:'#fff',i:'fa-info-circle'};
  const t = document.createElement('div');
  t.className='toast';
  t.style.cssText=`background:${c.bg};border-color:${c.b}`;
  t.innerHTML=`<i class="fas ${c.i}" style="color:${c.ic};font-size:1.1rem;flex-shrink:0;margin-top:1px"></i><div style="flex:1"><div style="font-weight:700;font-size:.85rem">${esc(title)}</div>${msg?`<div style="font-size:.75rem;color:rgba(255,255,255,.55);margin-top:2px">${esc(msg)}</div>`:''}</div><button onclick="this.closest('.toast').remove()" style="background:none;border:none;color:rgba(255,255,255,.35);cursor:pointer;font-size:.8rem;flex-shrink:0"><i class="fas fa-times"></i></button><div class="t-prog" style="background:${c.ic}"></div>`;
  wrap.prepend(t);
  let tm=setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),280)},3200);
  t.addEventListener('mouseenter',()=>clearTimeout(tm));
  t.addEventListener('mouseleave',()=>{tm=setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),280)},1800)});
}
const toast={success:(t,m)=>showToast('success',t,m),error:(t,m)=>showToast('error',t,m),warning:(t,m)=>showToast('warning',t,m),info:(t,m)=>showToast('info',t,m)};

/* ── LOAD FEEDBACKS (Realtime) ── */
function loadFeedbacks() {
  if(!FB_OK||!db) return;
  db.collection('feedbacks').orderBy('createdAt','asc').onSnapshot(snap => {
    const box = document.getElementById('chat-box');
    const emp = document.getElementById('empty-state');
    if(!box) return;
    box.querySelectorAll('.bubble-wrap').forEach(el=>el.remove());
    if(snap.empty) { if(emp) emp.style.display='flex'; return; }
    if(emp) emp.style.display='none';
    snap.forEach(doc => {
      const d = doc.data();
      const wrap = document.createElement('div');
      wrap.className='bubble-wrap';
      wrap.innerHTML=`
        <div class="bubble-row">
          <div class="avatar">${esc((d.name||'?').charAt(0).toUpperCase())}</div>
          <div class="bubble">
            <div class="bname">${esc(d.name||'Ẩn danh')}</div>
            <div class="btext">${esc(d.text||'').replace(/\n/g,'<br/>')}</div>
          </div>
        </div>
        <div class="btime">${esc(d.timeDisplay||'')}</div>`;
      box.appendChild(wrap);
    });
    box.scrollTop = box.scrollHeight;
  });
}

/* ── SEND FEEDBACK ── */
async function sendFeedback() {
  if(!FB_OK) { toast.error('Firebase chưa cấu hình!'); return; }
  if(!auth?.currentUser) { toast.warning('Vui lòng đăng nhập!'); openAuth('login'); return; }
  const textEl = document.getElementById('fb-text');
  const btnEl  = document.getElementById('send-btn');
  const text   = textEl.value.trim();
  if(!text) { toast.warning('Chưa có nội dung!','Nhập cảm nhận của bạn nhé.'); textEl.focus(); return; }
  if(text.length<3) { toast.warning('Quá ngắn!','Nhập ít nhất 3 ký tự.'); return; }
  const u    = auth.currentUser;
  const name = u.displayName || u.email.split('@')[0];
  btnEl.disabled=true; btnEl.innerHTML='<i class="fas fa-spinner fa-spin" style="color:#fff"></i>';
  try {
    await db.collection('feedbacks').add({
      name, text,
      timeDisplay: nowGMT7(),
      createdAt:   firebase.firestore.FieldValue.serverTimestamp(),
    });
    textEl.value='';
    document.getElementById('fb-char').textContent='0 / 300';
    textEl.style.height='auto';
    toast.success('Đã gửi! 💚','Cảm ơn bạn đã phản hồi.');
  } catch(e) {
    toast.error('Lỗi gửi!',e.message);
  } finally {
    btnEl.disabled=false; btnEl.innerHTML='<i class="fas fa-paper-plane" style="color:#fff"></i>';
  }
}

/* ── AUTH STATE ── */
auth?.onAuthStateChanged(user => {
  const area     = document.getElementById('auth-area');
  const loggedEl = document.getElementById('ui-logged');
  const guestEl  = document.getElementById('ui-guest');
  const textEl   = document.getElementById('fb-text');
  const btnEl    = document.getElementById('send-btn');

  if(user) {
    const nm = user.displayName || user.email.split('@')[0];
    if(area) area.innerHTML=`<div style="display:flex;align-items:center;gap:8px">
      <div style="width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#8BC34A,#FF9800);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:900;color:#fff">${esc(nm.charAt(0).toUpperCase())}</div>
      <span style="font-size:.85rem;font-weight:600;color:#fff;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(nm)}</span>
    </div>`;
    if(loggedEl) { loggedEl.style.display='flex'; document.getElementById('u-name').textContent=nm; document.getElementById('u-avatar').textContent=nm.charAt(0).toUpperCase(); }
    if(guestEl)  guestEl.style.display='none';
    if(textEl)   { textEl.disabled=false; textEl.placeholder='Nhập cảm nhận của bạn... 💬'; }
    if(btnEl)    btnEl.disabled=false;
    loadFeedbacks();
  } else {
    if(area) area.innerHTML=`<button onclick="openAuth('login')" class="login-btn"><i class="fas fa-user" style="margin-right:5px"></i> Đăng Nhập</button>`;
    if(loggedEl) loggedEl.style.display='none';
    if(guestEl)  guestEl.style.display='flex';
    if(textEl)   { textEl.disabled=true; textEl.placeholder='Đăng nhập để gửi phản hồi...'; }
    if(btnEl)    btnEl.disabled=true;
    loadFeedbacks();
  }
});

/* ── AUTH MODAL ── */
function openAuth(tab) { document.getElementById('auth-ov').classList.add('open'); switchTab(tab||'login'); }
function closeAuth()   { document.getElementById('auth-ov').classList.remove('open'); }
function switchTab(t) {
  const isL=t==='login';
  document.getElementById('frm-l').style.display=isL?'block':'none';
  document.getElementById('frm-r').style.display=isL?'none':'block';
  document.getElementById('tab-l').className='tab-btn '+(isL?'tab-active':'tab-inactive');
  document.getElementById('tab-r').className='tab-btn '+(isL?'tab-inactive':'tab-active');
  ['l-em-err','l-pw-err','r-nm-err','r-em-err','r-pw-err','r-cf-err'].forEach(id=>{const el=document.getElementById(id);if(el)el.classList.add('hidden')});
}
function toggleEye(id,btn) {
  const inp=document.getElementById(id),ic=btn.querySelector('i');
  inp.type=inp.type==='password'?'text':'password';
  ic.classList.toggle('fa-eye',inp.type==='password');
  ic.classList.toggle('fa-eye-slash',inp.type==='text');
}
function showErr(id,msg) { const el=document.getElementById(id);if(el){el.querySelector('span').textContent=msg;el.classList.remove('hidden')}}

function fbErr(code) {
  return ({'auth/email-already-in-use':'Email đã được đăng ký.','auth/invalid-email':'Email không hợp lệ.','auth/user-not-found':'Tài khoản không tồn tại.','auth/wrong-password':'Mật khẩu không đúng.','auth/invalid-credential':'Email hoặc mật khẩu không đúng.','auth/weak-password':'Mật khẩu quá yếu (≥6 ký tự).','auth/too-many-requests':'Quá nhiều lần thử. Thử lại sau.','auth/network-request-failed':'Lỗi kết nối mạng.'})[code]||'Lỗi không xác định. Kiểm tra Console (F12).';
}

async function doLogin() {
  ['l-em-err','l-pw-err'].forEach(id=>{const e=document.getElementById(id);if(e)e.classList.add('hidden')});
  const email=document.getElementById('l-email').value.trim();
  const pass=document.getElementById('l-pass').value;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showErr('l-em-err','Email không hợp lệ.');return;}
  if(pass.length<6){showErr('l-pw-err','Mật khẩu tối thiểu 6 ký tự.');return;}
  const btn=document.getElementById('l-btn');
  btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin mr-2"></i> Đang đăng nhập...';
  try {
    const cred=await auth.signInWithEmailAndPassword(email,pass);
    try{await db.collection('users').doc(cred.user.uid).set({lastLogin:nowGMT7(),email},{merge:true});}catch{}
    toast.success('Đăng nhập thành công!','Chào mừng trở lại!');
    closeAuth();
  } catch(e) { showErr('l-em-err',fbErr(e.code)); }
  finally { btn.disabled=false; btn.innerHTML='<i class="fas fa-sign-in-alt"></i> Đăng Nhập'; }
}

async function doRegister() {
  ['r-nm-err','r-em-err','r-pw-err','r-cf-err'].forEach(id=>{const e=document.getElementById(id);if(e)e.classList.add('hidden')});
  const name=document.getElementById('r-name').value.trim();
  const email=document.getElementById('r-email').value.trim();
  const pass=document.getElementById('r-pass').value;
  const conf=document.getElementById('r-conf').value;
  let ok=true;
  if(!name||name.length<2){showErr('r-nm-err','Họ tên tối thiểu 2 ký tự.');ok=false;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showErr('r-em-err','Email không hợp lệ.');ok=false;}
  if(pass.length<6){showErr('r-pw-err','Mật khẩu tối thiểu 6 ký tự.');ok=false;}
  if(pass!==conf){showErr('r-cf-err','Mật khẩu xác nhận không khớp.');ok=false;}
  if(!ok) return;
  const btn=document.getElementById('r-btn');
  btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin mr-2"></i> Đang tạo...';
  try {
    const cred=await auth.createUserWithEmailAndPassword(email,pass);
    const user=cred.user;
    try{await user.updateProfile({displayName:name});}catch{}
    const now=nowGMT7();
    try{await db.collection('users').doc(user.uid).set({uid:user.uid,fullName:name,email,registerTime:now,lastLogin:now,role:'user',createdAt:firebase.firestore.FieldValue.serverTimestamp()});}catch{}
    toast.success('Đăng ký thành công! 🎉',`Chào mừng ${name}!`);
    closeAuth();
  } catch(e) {
    const msg=fbErr(e.code);
    if(e.code==='auth/email-already-in-use')showErr('r-em-err',msg);
    else if(e.code==='auth/weak-password')showErr('r-pw-err',msg);
    else showErr('r-em-err',msg);
  }
  finally{ btn.disabled=false; btn.innerHTML='<i class="fas fa-user-plus"></i> Đăng Ký'; }
}

/* ── CHAR COUNT + AUTO RESIZE ── */
document.getElementById('fb-text')?.addEventListener('input', function() {
  const len=this.value.length;
  const el=document.getElementById('fb-char');
  if(el){ el.textContent=len+' / 300'; el.style.color=len>270?'#FF9800':'rgba(255,255,255,.25)'; }
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,110)+'px';
});
</script>
